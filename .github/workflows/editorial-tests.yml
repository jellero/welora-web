name: Editorial PHP tests
on:
  push:
    branches: [main]
    paths:
      - 'editorial-*.php'
      - 'lib/editorial-store.php'
      - 'tests/editorial-smoke.php'
      - '.github/workflows/editorial-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, dom, fileinfo
          coverage: none
      - name: PHP lint
        run: |
          php -l lib/editorial-store.php
          php -l editorial-api.php
          php -l editorial-admin.php
          php -l editorial-media.php
          php -l editorial-public.php
          php -l tests/editorial-smoke.php
      - name: Isolated editorial smoke
        run: php tests/editorial-smoke.php
